[project]
name = "neutriai-api"
version = "1.0.0"
description = "NeutriAI backend — AI nutrition, fitness and lifestyle API"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "pydantic>=2.9",
  "pydantic-settings>=2.6",
  "httpx>=0.27",
  "python-jose[cryptography]>=3.3",
  "supabase>=2.16",
  "postgrest>=0.17",
  "stripe>=11.1",
  "anthropic>=0.39",
  "openai>=1.54",
  "pillow>=11.0",
  "numpy>=2.1",
  "cryptography>=43.0",
  "structlog>=24.4",
  "redis>=5.2",
  "tenacity>=9.0",
  "python-multipart>=0.0.12",
  "apscheduler>=3.10",
  "opencv-python-headless>=4.10",
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "pytest-asyncio>=0.24", "respx>=0.21", "ruff>=0.7", "mypy>=1.13"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
